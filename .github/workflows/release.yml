name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: bash scripts/smoke.sh
      - name: Package self-hosted server
        run: |
          mkdir release
          cp -R dist sql scripts server package.json package-lock.json .env.example README.md README.zh-CN.md CONTRIBUTING.md SECURITY.md LICENSE AGENTS.md SPEC.md PROMPTS.md docs release/
          tar -czf veladeck-server.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: veladeck-server.tar.gz
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veladeck-release.p12"
      - name: Test, build and lint signed Android companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/veladeck-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          gradle --no-daemon -p android testDebugUnitTest assembleRelease lintRelease
      - name: Verify installable APK
        run: |
          mkdir apk
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK="apk/VelaDeck-${VERSION}-preview.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > apk/APK-VERIFICATION.txt
          EXPECTED=$(tr -d '[:space:]' < android/release-certificate.sha256)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk/APK-VERIFICATION.txt)
          test "$EXPECTED" = "$ACTUAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" >> apk/APK-VERIFICATION.txt
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/veladeck-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apk/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
          gh release create "$TAG" ./* --verify-tag --prerelease --title "VelaDeck $TAG · Native Android" --notes-file ../docs/RELEASE_NOTES.md
