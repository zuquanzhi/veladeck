name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: bash scripts/smoke.sh
      - name: Package self-hosted server
        run: |
          mkdir release
          cp -R dist sql scripts server package.json package-lock.json .env.example README.md README.zh-CN.md CONTRIBUTING.md SECURITY.md LICENSE AGENTS.md SPEC.md PROMPTS.md docs release/
          tar -czf veladeck-server.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: veladeck-server.tar.gz
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android companion
        run: gradle --no-daemon -p android assembleDebug lintDebug
      - name: Verify installable APK
        run: |
          mkdir apk
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK="apk/VelaDeck-${VERSION}-preview.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" > apk/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" >> apk/APK-VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apk/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
          gh release create "$TAG" ./* --verify-tag --prerelease --title "VelaDeck $TAG · Visual Refresh" --notes-file ../docs/RELEASE_NOTES.md
