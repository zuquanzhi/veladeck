name: Android update smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build an older-version test baseline with the fixed key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/veladeck-release.p12
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          mkdir -p .tools
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          package = json.loads(p.read_text())
          version = package['version']
          major, minor, patch = map(int, version.split('.'))
          baseline = (major, minor, patch - 1) if patch else ((major, minor - 1, 999) if minor else (major - 1, 999, 999))
          assert min(baseline) >= 0
          package['version'] = '.'.join(map(str, baseline))
          p.write_text(json.dumps(package))
          Path('.tools/update-smoke-config.json').write_text(json.dumps({'target': version, 'code': major * 1000000 + minor * 1000 + patch, 'baseline': package['version']}))
          PY
          gradle --no-daemon -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk .tools/update-baseline.apk
      - name: Remove runner signing key before emulator actions
        if: always()
        run: rm -f "$RUNNER_TEMP/veladeck-release.p12"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise published update, permission and installation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-update-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-update-smoke
          path: .tools/android-update-smoke/
