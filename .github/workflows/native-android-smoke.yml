name: Native Android smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/native-android']
permissions:
  contents: read
jobs:
  native-ui-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create an ephemeral HTTPS fixture trusted by this debug build only
        run: |
          mkdir -p .tools/native-tls android/app/src/debug/res/raw android/app/src/debug/res/xml
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$RUNNER_TEMP/native-qa.key" -out .tools/native-tls/ca.crt -subj '/CN=VelaDeck Native QA' -addext 'subjectAltName=IP:10.0.2.2' -addext 'basicConstraints=critical,CA:TRUE' 2>/dev/null
          cp .tools/native-tls/ca.crt android/app/src/debug/res/raw/native_qa_ca.crt
          cat > android/app/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:networkSecurityConfig="@xml/native_qa_network" /></manifest>
          XML
          cat > android/app/src/debug/res/xml/native_qa_network.xml <<'XML'
          <network-security-config><debug-overrides><trust-anchors><certificates src="@raw/native_qa_ca" /></trust-anchors></debug-overrides></network-security-config>
          XML
      - run: gradle --no-daemon -p android testDebugUnitTest assembleDebug lintDebug
      - name: Start synthetic loopback API and HTTPS bridge
        env:
          NATIVE_QA_KEY: ${{ runner.temp }}/native-qa.key
        run: |
          node --import tsx scripts/native-fixture.mjs > .tools/native-fixture.log 2>&1 &
          echo $! > .tools/native-fixture.pid
          python3 scripts/native-tls-proxy.py > .tools/native-proxy.log 2>&1 &
          echo $! > .tools/native-proxy.pid
          for i in $(seq 1 60); do
            if test -f .tools/native-fixture.json && curl -kfsS https://127.0.0.1:18443/dock/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'Synthetic API fixture did not become ready'
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/native-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-smoke
          path: .tools/native-qa-artifact/
      - name: Remove ephemeral fixture key and stop fixtures
        if: always()
        run: |
          for file in .tools/native-fixture.pid .tools/native-proxy.pid; do
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          rm -f "$RUNNER_TEMP/native-qa.key"
