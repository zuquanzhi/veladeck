plugins { id 'com.android.application' }
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
android {
    namespace 'io.github.zuquanzhi.veladeck'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'io.github.zuquanzhi.veladeck'; minSdk 26; targetSdk 35; versionCode 2; versionName packageVersion }
    buildTypes { debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
