plugins { id 'com.android.application' }
android {
    namespace 'io.github.zuquanzhi.runotter'
    compileSdk 35
    defaultConfig { applicationId 'io.github.zuquanzhi.runotter'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    buildTypes { debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
